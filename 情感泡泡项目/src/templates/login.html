{% extends 'base.html' %}
{% block title %}登录 · 情感泡泡{% endblock %}
{% block content %}
<div class="auth-scene">
  <div class="auth-card card">
    <h1 class="auth-logo">💭 情感泡泡</h1>
    <p class="auth-sub">找到你心中的那份缘分</p>

    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}

    <form id="login-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <input class="input" name="username" placeholder="用户名" required>
      <input class="input" type="password" name="password" placeholder="密码" required>
      <button class="btn-primary btn-block" type="submit">登 录</button>
    </form>

    <form id="register-form" method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <input class="input" name="username" placeholder="用户名（即公屏昵称）" required>
      <input class="input" type="password" name="password" placeholder="密码（至少 6 位）" required>
      <input class="input" name="invite_code" placeholder="邀请码" required>
      <button class="btn-primary btn-block" type="submit">注 册</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // 切换入口现在在顶栏（base.html 的 .nav-auth），这里只负责表单与高亮同步
  function showTab(t) {
    document.getElementById('login-form').classList.toggle('hidden', t !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', t !== 'register');
    var tl = document.getElementById('nav-tab-login');
    var tr = document.getElementById('nav-tab-register');
    if (tl) tl.classList.toggle('is-active', t === 'login');
    if (tr) tr.classList.toggle('is-active', t === 'register');
  }
  showTab('{{ active_tab }}');
</script>
{% endblock %}
