<div class="panel-head">
  <span class="panel-title">💬 我的对话</span>
  <button class="panel-close" type="button" onclick="closeSidebar()">✕</button>
</div>
{% for c in conversations %}
  {% set other = c['helper_nickname'] if c['author_nickname'] == current_user['username'] else c['author_nickname'] %}
  <div class="conv-row" data-open-panel="{{ url_for('panel_conversation', conversation_id=c['id']) }}">
    <span class="conv-emoji">{{ emotion_icons[c['bubble_emotion']] }}</span>
    <span class="conv-other">👤 {{ other }}</span>
    <span class="conv-go">→</span>
  </div>
{% else %}
  <div class="empty">还没有对话<br>去泡泡墙帮助别人，或等待别人来帮你吧 💕</div>
{% endfor %}
