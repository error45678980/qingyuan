{% for bubble in bubbles %}
  {% set v = bubble_style(bubble) %}
  <div class="soap" data-bubble-id="{{ bubble['id'] }}"
       style="--size:{{ v.size }}px; --x:{{ v.x }}px; --y:{{ v.y }}px; --drop:{{ v.drop }}px; --fall:{{ v.fall }}s; --c1:{{ v.c1 }}; --c2:{{ v.c2 }}; --c3:{{ v.c3 }}; --c4:{{ v.c4 }}; --glow:{{ v.glow }}; --core:{{ v.core }}; --dur:{{ v.dur }}s; --delay:{{ v.delay }}s;">
    <span class="soap-film"></span>
    <span class="soap-rim"></span>
    <span class="soap-caustic"></span>
    <span class="soap-highlight"></span>
    <span class="soap-ring"></span>
    <span class="soap-ring ring-2"></span>
    <span class="soap-shadow"></span>
    <span class="soap-text">
      <span class="soap-emoji">{{ emotion_icons[bubble['emotion_tag']] }}</span>
      <span class="soap-content">{{ bubble['content'] }}</span>
    </span>
  </div>
{% else %}
<div class="empty">💫 还没有泡泡哦~<br>点击右下角的 ＋ 发布你的第一个心情吧！</div>
{% endfor %}
