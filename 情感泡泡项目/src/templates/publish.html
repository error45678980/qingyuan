{% extends 'base.html' %}
{% block title %}发布 · 情感泡泡{% endblock %}
{% block content %}
<div class="publish-card card">
  <h2>💭 发布心情</h2>
  <form method="post" action="{{ url_for('publish') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

    <label>你的情感诉说 ✍️</label>
    <textarea class="input" name="content" rows="5" placeholder="写下你现在的心情...分享你的感受，会有人看见的 🌟" required></textarea>

    <label>情感标签</label>
    <div class="emotion-picker">
      {% for e in all_emotions %}
      <label class="emo-option" style="--accent: {{ emotion_colors[e][1] }}">
        <input type="radio" name="emotion_tag" value="{{ e }}" {{ 'checked' if loop.first }}>
        <span>{{ emotion_icons[e] }} {{ e }}</span>
      </label>
      {% endfor %}
    </div>

    <label>回复模式</label>
    <div class="mode-picker">
      <label class="mode-option">
        <input type="radio" name="reply_mode" value="single" checked>
        <span>📝 单次回复</span>
        <small>每个人只能回复一次，简单直接</small>
      </label>
      <label class="mode-option">
        <input type="radio" name="reply_mode" value="dialog">
        <span>💬 短时对话框</span>
        <small>建立私密对话，深入交流</small>
      </label>
    </div>

    <button class="btn-primary btn-block" type="submit">🌟 发布泡泡</button>
  </form>
</div>
{% endblock %}
